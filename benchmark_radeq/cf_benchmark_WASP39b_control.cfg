[pyrat]

# Pyrat Bay run mode [tli atmosphere spectrum radeq opacity retrieval]
runmode = spectrum

# Output log and spectrum file names:
logfile = cf_WASP39b_radeq_benchmark_control.log

# Observing geometry, select between: [transit eclipse]
rt_path = emission_two_stream

# Number of radiative-equilibrium iterations
nsamples = 250

# System parameters (Mancini+2018):
rstar = 0.940 rsun
mstar = 0.913 msun
tstar = 5500.0
log_gstar = 4.5
Fe_H_star = -0.12
starspec = ../inputs/helios_phoenix_WASP39b_5500K_m00_logg4.5.dat

rplanet = 1.280 rjup
mplanet = 0.281 mjup
smaxis = 0.048 au
tint = 0.0
refpressure = 1.0 bar

# Wavelength sampling
wl_low = 0.15 um
wl_high = 33.0 um
wl_thinning = 6

# A generic set of observing bands in the NIR
obsfile = ../inputs/obs_generic_nir.dat
dunits = ppm

# Atmospheric model:
atmfile = WASP39b_radeq_benchmark_control.atm
radmodel = hydro_m

# Opacity file name, temperature range, and step:
sampled_cross_sec =
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_C2H2_exomol_acety.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_CH4_exomol_mm.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_CO2_ames_ai3000k.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_CO_hitemp_2019.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_H2O_exomol_pokazatel.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_H2S_exomol_ayt2.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_HCN_exomol_harris_larner.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_NH3_exomol_coyute.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_SO2_exomol_exoames.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_Fe_vald.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_K_vald.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_Mg_vald.npz
  ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_Na_vald.npz

# Cross-section opacity files:
continuum_cross_sec =
    {ROOT}/pyratbay/data/CIA/CIA_Borysow_H2H2_0060-7000K_0.6-500um.dat
    {ROOT}/pyratbay/data/CIA/CIA_Borysow_H2He_0050-7000K_0.5-031um.dat


# Rayleigh models, select from: [lecavelier rayleigh_H rayleigh_He rayleigh_H2]
rayleigh =
    rayleigh_He
    rayleigh_H
    rayleigh_H2
    rayleigh_e-

h_ion = h_ion_john1988

# Verbosity level [1--5]:
verb = 2
