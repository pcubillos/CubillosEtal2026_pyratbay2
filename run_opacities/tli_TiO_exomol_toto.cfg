[pyrat]

# Pyrat Bay run mode [tli atmosphere spectrum opacity radeq retrieval]
runmode = tli

# Output file:
logfile = Exomol_TiO_0.15-33.0um.log

# List of line-transtion databases:
dblist = ../inputs/opacity/TiO_exomol_toto_0.33-500um_100-3500K_threshold_0.01_lbl.dat

# Type of line-transition database [hitran exomol repack]
dbtype = repack
# List of partition functions for each database:
pflist = PF_exomol_TiO.dat

# Initial and final wavelength:
wllow = 0.15 um
wlhigh = 33.0 um

# Verbosity level [1--3]:
verb = 2
