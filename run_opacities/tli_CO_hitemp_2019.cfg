[pyrat]

# Pyrat Bay run mode, select from: [tli atmosphere spectrum opacity radeq mcmc]
runmode = tli

# Output TLI file:
logfile = HITEMP_CO_0.15-33.0um.log

# List of line-transtion databases:
dblist = ../inputs/opacity/05_HITEMP2019.par

# Type of line-transition database [hitran exomol repack]
dbtype = hitran
# List of partition functions for each database:
pflist = tips

# Wavelength ranges:
wllow = 0.15 um
wlhigh = 33.0 um

# Verbosity level (<0:errors, 0:warnings, 1:headlines, 2:details, 3:debug):
verb = 2
