[pyrat]

# Pyrat Bay run mode [tli atmosphere spectrum opacity radeq retrieval]
runmode = tli

# Output file:
logfile = Exomol_CH4_0.15-33.0um.log

# List of line-transtion databases:
dblist = ../inputs/opacity/CH4_exomol_mm_0.83-50.0um_100-3000K_threshold_0.03_lbl.dat

# Type of line-transition database [hitran exomol repack]
dbtype = repack
# List of partition functions for each database:
pflist = PF_exomol_CH4.dat

# Initial and final wavelength:
wllow = 0.15 um
wlhigh = 33.0 um

# Verbosity level [1--3]:
verb = 2
