[pyrat]

# Pyrat Bay run mode [tli atmosphere spectrum opacity radeq retrieval]
runmode = tli

# Output file:
logfile = Ames_CO2_0.15-33.0um.log

# List of line-transtion databases:
dblist = ../inputs/opacity/CO2_ames_ai3000k_0.5-50.0um_100-3500K_threshold_0.01_lbl.dat

# Type of line-transition database [hitran exomol repack]
dbtype = repack
# List of partition functions for each database:
pflist = PF_ames_CO2.dat

# Initial and final wavelength:
wllow = 0.15 um
wlhigh = 33.0 um

# Verbosity level [1--3]:
verb = 2
