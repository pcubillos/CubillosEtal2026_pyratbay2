[pyrat]

# Pyrat Bay run mode [tli atmosphere spectrum opacity radeq retrieval]
runmode = opacity

# Output log and spectrum file names:
logfile = cross_section_0.15-33.0um_0200-5000K_R025K_HCN_exomol.log

# TLI opacity files:
tlifile = Exomol_HCN_0.15-33.0um.tli

# Atmospheric model:
ptop = 1e-9 bar
pbottom = 1e3 bar
nlayers = 61

chemistry = tea
species =
    H  He  C  O  N  Na  K  S  Si  Mg Fe  Ti  V Al Cl
    H2  H2O  CH4  CO  CO2  HCN  NH3  N2  OH  C2H2  C2H4
    S2  SH  H2S  SO2  SO  TiO  VO  TiO2  VO2 SiO
    e-  H-  H+  H2+  He+  Na-  Na+  Mg+ K-  K+  Fe+  Ti+  V+

tmodel = isothermal
tpars = 1000.0

# Wavelength sampling
wllow = 0.15 um
wlhigh = 33.0 um
resolution = 25000.0

# Voigt line max extent (in HWHM)
voigt_extent = 300.0

tmin =  200
tmax = 5000
tstep = 150
ncpu = 128

# Verbosity level [1--3]:
verb = 2
