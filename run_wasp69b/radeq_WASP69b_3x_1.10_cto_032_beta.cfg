[pyrat]

# Pyrat Bay run mode [tli atmosphere spectrum radeq opacity retrieval]
runmode = radeq
verb = 2
nsamples = 200

# Output file names:
logfile = WASP69b_radeq_3x_1.10_cto_032_beta.log

# Observing geometry, select between: [transit eclipse]
rt_path = emission_two_stream

# System parameters (Bonomo et al. 2017):
rstar = 0.813 rsun
mstar = 0.826 msun
tstar = 4700.0
log_gstar = 4.535
starspec = ../inputs/synphot_phoenix_WASP69b_4700K_m00_logg4.5.dat

rplanet = 1.057 rjup
mplanet = 0.250 mjup
smaxis = 0.04527 au
tint = 100.0
refpressure = 1e-4 bar

# Wavelength sampling
wl_low = 0.15 um
wl_high = 33.0 um
wl_thinning = 4


# Atmospheric model
ptop = 1.0e-9 bar
pbottom = 100 bar
nlayers = 81

tmodel = isothermal
tpars = 900.0

chemistry = equilibrium
species =
    H  He  C  N  O  Na  K  Mg  Si  P  S  Cl Ti  V Fe
    H2  H2O  CH4  CO  CO2  HCN  NH3  N2  OH  C2H2  C2H4
    S2  SH  H2S  SO2  SO  TiO  VO  TiO2  VO2   SiO  SiH  SiS  SiH4
    OCS PH PH3 PN PO KOH CS CS2 NaH  NaCl  HCl  KCl NaOH
    e-  H-  H+  H2+  He+  Na-  Na+  Mg+ K-  K+  Fe+  Ti+  V+  SiH+ Si- Si+

radmodel = hydro_m

# Metallicity:
vmr_vars =
    [M/H] 0.5
    C/O   1.1

# Stellar irradiation scaling factor, beta = (1-A)/f:
beta_irr = 0.32

# Opacity file name, temperature range, and step:
sampled_cross_sec =
    ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_CH4_exomol_mm.npz
    ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_CO_hitemp_2019.npz
    ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_CO2_ames_ai3000k.npz
    ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_C2H2_exomol_acety.npz
    ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_H2O_exomol_pokazatel.npz
    ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_H2S_exomol_ayt2.npz
    ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_HCN_exomol_harris_larner.npz
    ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_NH3_exomol_coyute.npz
    ../inputs/cross_section_0.15-33.0um_0200-5000K_R025K_SO2_exomol_exoames.npz

# Cross-section opacity files:
continuum_cross_sec =
    {ROOT}/pyratbay/data/CIA/CIA_Borysow_H2H2_0060-7000K_0.6-500um.dat
    {ROOT}/pyratbay/data/CIA/CIA_Borysow_H2He_0050-7000K_0.5-031um.dat

# Rayleigh models, select from: [dalgarno_H dalgarno_He dalgarno_H2]
rayleigh =
    rayleigh_He
    rayleigh_H
    rayleigh_H2

# Alkali models, select from: [sodium_vdw potassium_vdw]
alkali =
    sodium_vdw
    potassium_vdw

h_ion = h_ion_john1988
