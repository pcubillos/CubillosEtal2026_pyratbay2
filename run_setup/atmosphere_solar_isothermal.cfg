[pyrat]
# Pyrat Bay run mode, select from: [tli atmosphere spectrum opacity radeq mcmc]
runmode = atmosphere

# Output atmospheric model:
atmfile = piMensac_isothermal_solar.atm

# Pressure at the top and bottom of the atmosphere, and number of layers:
ptop    = 1.0e-9 bar
pbottom = 1.0e+2 bar
nlayers = 81

# Temperature-profile model, select from [isothermal tcea madhu]
tmodel = isothermal
tpars  = 1150.0

# System parameters (Gandolfi et al. 2018):
rstar   = 1.02 rsun
tstar   = 5870.0
smaxis = 0.067 au
mplanet = 4.52 mearth
rplanet = 2.06 rearth
tint = 100.0

# Chemistry model, select from [uniform tea]
chemistry = tea
# Atmospheric composition and abundances:
elements = H He C N O Na K Ti V
species =
    H  He  C  N  O  Na  K  Ti  V
    H2  H2O  CH4  CO  CO2  HCN  NH3  C2H2  C2H4  N2 TiO  VO
# Solar-metallicity scaling factor (for everything except H, He):
xsolar = 1.0

# Verbosity level (<0:errors, 0:warnings, 1:headers, 2:details, 3:debug):
verb = 2
