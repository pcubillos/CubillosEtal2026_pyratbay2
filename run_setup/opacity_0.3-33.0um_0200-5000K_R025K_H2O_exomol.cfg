[pyrat]
# Pyrat Bay run mode, select from: [tli atmosphere spectrum opacity radeq mcmc]
runmode = opacity

# Output file names:
logfile = cross_section_0.3-33.0um_0200-5000K_R025K_H2O_exomol.log

# Atmospheric model:
ptop = 1.0e-08 bar
pbottom = 1.0e+03 bar
nlayers = 56

tmodel = isothermal
tpars = 1000.0

chemistry = tea
species =
    H  He  C  O  N  Na  K  S  Si  Fe  Ti  V
    H2  H2O  CH4  CO  CO2  HCN  NH3  C2H2  C2H4  N2  TiO  VO  OH
    S2  SH  SiO  H2S  SO2  SO  TiO2  VO2

# TLI opacity files:
tlifile = Exomol_H2O_0.24-33.0um.tli

# Wavelength sampling boundaries:
wllow = 0.3 um
wlhigh = 33.0 um
vextent = 300.0
resolution = 25000.0

tmin = 200
tmax = 5000
tstep = 150
ncpu = 96

# Verbosity level (<0:errors, 0:warnings, 1:headlines, 2:details, 3:debug):
verb = 2
