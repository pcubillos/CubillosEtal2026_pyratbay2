[pyrat]
# Pyrat Bay run mode, select from: [tli atmosphere spectrum opacity radeq mcmc]
runmode = opacity

# Atmospheric model:
ptop = 1.0e-08 bar
pbottom = 1.0e+03 bar
nlayers = 56

tmodel = isothermal
tpars = 1000.0

chemistry = tea
species =
    H  He  C  O  N  Na  K  S  Si  Fe  Ti  V
    H2  H2O  CH4  CO  CO2  HCN  NH3  C2H2  C2H4  N2  TiO  VO  OH
    S2  SH  SiO  H2S  SO2  SO  TiO2  VO2

# TLI opacity files:
tlifile = Exomol_H2O_0.24-33.0um.tli

# Wavelength sampling boundaries:
wllow = 0.3 um
wlhigh = 33.0 um
vextent = 300.0
resolution = 15000.0

# Output file names:
extfile = cross_section_125-3500K_0.3-33.0um_R15K_H2O_exomol.npz
tmin =  125
tmax = 3500
tstep = 125
ncpu = 48

# Verbosity level (<0:errors, 0:warnings, 1:headlines, 2:details, 3:debug):
verb = 2
