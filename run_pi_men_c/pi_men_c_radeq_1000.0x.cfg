[pyrat]

# Pyrat Bay run mode, select from: [tli atmosphere spectrum opacity radeq mcmc]
runmode = radeq

# Observing geometry, select between: [transit eclipse]
rt_path = emission_two_stream

# Output file names:
specfile = radeq_emission_pi_men_c_1000.0x.dat

# Atmospheric model:
input_atmfile = profile_species.atm

# System parameters (Gandolfi et al 2018)
rstar = 1.10 rsun
mstar = 1.02 msun
tstar = 5870.0
log_gstar = 4.36
Fe_H_star = 0.05
kurucz = ../inputs/fp00k2odfnew.pck

rplanet = 2.06 rearth
mplanet = 4.52 mearth
smaxis = 0.067 au
tint = 100.0
refpressure = 0.035 bar

# Wavelength sampling
wllow =  0.3 um
wlhigh = 33.0 um
resolution = 15000.0

# Pressure sampling
ptop = 1e-8 bar
pbottom = 1e2 bar
nlayers = 81

#tmodel = guillot
chemistry = tea
radmodel = hydro_m

# Stellar irradiation scaling factor, beta = (1-A)/f:
beta_irr = 0.667
metallicity = 3.0


# Opacity file name, temperature range, and step:
extfile =
    ../run_setup/extfile_H2O_0100-3500K_0.3-33.0um.npz
    ../run_setup/extfile_CO_0100-3500K_0.3-33.0um.npz
    ../run_setup/extfile_CO2_0100-3500K_0.3-33.0um.npz
    ../run_setup/extfile_CH4_0100-3500K_0.3-33.0um.npz
    ../run_setup/extfile_HCN_0100-3500K_0.3-33.0um.npz
    ../run_setup/extfile_NH3_0100-3500K_0.3-33.0um.npz
    ../run_setup/extfile_C2H2_0100-3500K_0.3-33.0um.npz

# Cross-section opacity files:
csfile =
    {ROOT}/pyratbay/data/CIA/CIA_Borysow_H2H2_0060-7000K_0.6-500um.dat
    {ROOT}/pyratbay/data/CIA/CIA_Borysow_H2He_0050-7000K_0.5-031um.dat

# Rayleigh models, select from: [lecavelier dalgarno_H dalgarno_He dalgarno_H2]
rayleigh =
    dalgarno_He
    dalgarno_H
    dalgarno_H2

# Alkali models, select from: [sodium_vdw potassium_vdw]
alkali =
    sodium_vdw
    potassium_vdw

h_ion = h_ion_john1988

# Number of CPUs to use for parallel processing:
nsamples = 200

# Verbosity level (<0:errors, 0:warnings, 1:headlines, 2:details, 3:debug):
verb = 2
